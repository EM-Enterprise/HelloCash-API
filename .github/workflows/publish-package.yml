name: Publish NPM Package to GitHub Packages Registry

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      - name: Set up Node 24.22.1
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          registry-url: "https://npm.pkg.github.com"
          scope: "@em-enterprise"

      - name: Install Dependencies
        run: yarn --frozen-lockfile

      - name: Determine package version and distribution tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            DIST_TAG="latest"
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-canary\.[0-9]+$ ]]; then
            DIST_TAG="canary"
          else
            echo "Unsupported release tag: $GITHUB_REF_NAME"
            exit 1
          fi

          echo "NEW_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"
          echo "Release version: $VERSION (npm tag: $DIST_TAG)"

      - name: Check if version is already published
        id: check_published
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "Checking $PACKAGE_NAME@$NEW_VERSION"

          PUBLISHED_VERSIONS=$(npm view "$PACKAGE_NAME" versions --json --registry=https://npm.pkg.github.com 2>/dev/null || echo '[]')

          if PUBLISHED_VERSIONS="$PUBLISHED_VERSIONS" node -e '
            const versions = JSON.parse(process.env.PUBLISHED_VERSIONS);
            const list = Array.isArray(versions) ? versions : [versions];
            process.exit(list.includes(process.env.NEW_VERSION) ? 0 : 1);
          '; then
            echo "VERSION_ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
            echo "Version $NEW_VERSION is already published"
          else
            echo "VERSION_ALREADY_PUBLISHED=false" >> "$GITHUB_ENV"
            echo "Version $NEW_VERSION has not been published"
          fi

      - name: Set Package version
        if: env.VERSION_ALREADY_PUBLISHED == 'false'
        run: npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version

      - name: Publish package
        if: env.VERSION_ALREADY_PUBLISHED == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Publishing $NEW_VERSION with npm tag $DIST_TAG"
          npm publish --tag "$DIST_TAG" --registry=https://npm.pkg.github.com
